# Gera o executável portátil e o instalador para Windows numa máquina Windows
# do GitHub (o jpackage não gera pacotes de Windows a partir do Linux).
#
# Como executar: aba "Actions" do repositório → "Windows installer" → "Run workflow".
# Também roda automaticamente ao publicar uma tag "v*" (ex.: v1.0.0).
# Os arquivos gerados ficam em "Artifacts", no resumo da execução.
name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Gerar executável e instalador
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1

      - name: Publicar os arquivos gerados
        uses: actions/upload-artifact@v4
        with:
          name: cg-tp1-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
